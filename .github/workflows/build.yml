name: Verificar e compilar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/main.dart lib/staff
      - run: flutter analyze lib/main.dart lib/staff
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lanche-facil-gestao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: flutter build web --release --base-href /app/
      - uses: actions/upload-artifact@v4
        with:
          name: lanche-facil-gestao-web
          path: build/web/
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-lockfile
          path: pubspec.lock
