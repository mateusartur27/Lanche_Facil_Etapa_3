name: novo_ifood
description: "Lanche Fácil — gestão de fotos e fichas técnicas do cardápio."
publish_to: "none"

version: 3.0.1+4

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # Framework do app. A versão mínima do Dart está na seção environment.
  flutter:
    sdk: flutter
  # Cliente HTTP usado no login, nas rotas protegidas e no upload com progresso.
  dio: ^5.9.0
  # Abre o seletor do dispositivo ou do navegador.
  file_picker: ^12.3.0
  # Exibe a confirmação do envio na central de notificações do Android.
  flutter_local_notifications: 19.5.0
  # Guarda o token da sessão no armazenamento seguro do Android.
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1
  sqflite_common_ffi_web: ^1.1.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
